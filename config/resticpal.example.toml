schema_version = 1

[backup]
paths = [
  'C:\Users\Example\Desktop',
  'C:\Users\Example\Documents',
  'C:\Users\Example\Pictures',
]
exclusions = [
  '*.tmp',
  'node_modules',
]

[repository]
display_name = "Managed S3 backup"
url = "s3:https://s3.example.test/restic-backups/device-1"
mode = "append_only"

[repository.options]
"s3.region" = "us-west-2"
"s3.bucket-lookup" = "path"

# Values are opaque IDs resolved from the service-only protected credential store.
[repository.secret_refs]
RESTIC_PASSWORD = "repository-password"
AWS_ACCESS_KEY_ID = "s3-access-key-id"
AWS_SECRET_ACCESS_KEY = "s3-secret-access-key"

[schedule]
interval_hours = 24
wake_grace_seconds = 300
wake_lock_timeout_seconds = 7200
allow_on_battery = true
allow_metered_network = true

# Informational in append-only mode; server-side maintenance owns retention.
[retention]
daily = 7
weekly = 5
monthly = 12
yearly = 3
prune_interval_days = 7

# When enabled, the tray asks the LocalSystem service to download, verify, and
# install newer resticpal MSIs silently. The pinned Ed25519 signature remains
# mandatory and a running backup is never interrupted. Omit this field to
# inherit an unlocked managed-policy recommendation.
[updates]
automatic_install = false

# Standalone administrators may browse snapshots and restore files by default.
# Managed installations require an explicit schema-v3 restore.enabled grant;
# an unlocked grant can be overridden by this local setting.
[restore]
enabled = true

[management]
mode = "disabled"

# Plain-file mode accepts a direct ManifestPayload from any ordinary HTTP or
# HTTPS file server and never uploads device status:
# mode = "plain_manifest"
# manifest_url = "http://config.example.test/resticpal/example-laptop.json"
# refresh_interval_minutes = 15

# Signed mode pins an Ed25519 public key. Non-loopback URLs require HTTPS.
# status_url, device_id, and status_token_ref must be supplied together; the
# opaque token reference is resolved only by the service DPAPI store.
# mode = "signed_manifest"
# manifest_url = "https://backup.example.test/v1/manifest/example-laptop"
# signing_public_key = "base64url-ed25519-public-key"
# refresh_interval_minutes = 15
# status_url = "https://backup.example.test/v1/status"
# device_id = "example-laptop"
# status_token_ref = "management-token-opaque-reference"
