[workspace]
members = [
    "apps/resticpal-service",
    "apps/resticpal-tray",
    "crates/resticpal-core",
    "crates/resticpal-protocol",
    "crates/resticpal-windows",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
authors = ["Yann Ramin"]
license = "BSD-2-Clause"

[workspace.dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
resticpal-core = { path = "crates/resticpal-core" }
resticpal-protocol = { path = "crates/resticpal-protocol" }
resticpal-windows = { path = "crates/resticpal-windows" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "1.1.4"
windows = "0.62.2"
windows-service = "0.8.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
