[workspace]
members = [
    "apps/resticpal-service",
    "apps/resticpal-tray",
    "crates/resticpal-core",
    "crates/resticpal-protocol",
    "crates/resticpal-windows",
]
# The e2e CI job checks resticpal-server out inside this workspace; without the
# exclusion cargo would claim the nested package as a workspace member.
exclude = ["resticpal-server"]
resolver = "3"

[workspace.package]
version = "1.0.5"
edition = "2024"
rust-version = "1.97"
authors = ["Yann Ramin"]
license = "BSD-2-Clause"

[workspace.dependencies]
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
ed25519-dalek = { version = "3.0.0", features = ["signature"] }
embed-resource = "3.0.5"
getrandom = "0.3.4"
hkdf = "0.13.0"
resticpal-core = { path = "crates/resticpal-core" }
resticpal-protocol = { path = "crates/resticpal-protocol" }
resticpal-windows = { path = "crates/resticpal-windows" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tempfile = "3.23.0"
toml = "1.1.4"
ureq = { version = "3.4.0", default-features = false, features = ["json", "native-tls", "win-system-proxy"] }
url = "2.5.8"
windows = "0.62.2"
windows-service = "0.8.1"
x25519-dalek = { version = "3.0.0", features = ["getrandom", "static_secrets"] }
zeroize = "1.8.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
